version: '3.8'

services:
  sharelocal:
    build: .
    container_name: sharelocal
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - SHARE_EXPIRATION_MINUTES=30
      - MAX_FILE_SIZE=524288000
      - STORAGE_PATH=/app/server/uploads
    volumes:
      - ./server/uploads:/app/server/uploads
